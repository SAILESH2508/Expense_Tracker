<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  
  <!-- Link to Font Awesome for Social Media Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <!-- Internal CSS (For simplicity, placed within this file) -->
  <style>
    /* Footer Styles */
    .footer {
      background-color: #f1f1f1;
      padding: 40px 0;
      text-align: center;
    }

    .footer-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-left h3 {
      margin: 0;
      color: #333;
      font-size: 28px;
    }

    .footer-left p {
      font-size: 16px;
      color: #666;
      margin: 10px 0;
    }

    .footer-right ul {
      list-style: none;
      padding: 0;
    }

    .footer-right ul li {
      display: inline;
      margin: 0 15px;
    }

    .footer-right ul li a {
      color: #333;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .footer-right ul li a:hover {
      color: #0073e6;
    }

    /* Social Media Icons */
    .social-icons a {
      margin: 0 10px;
      font-size: 24px;
      color: #333;
      transition: color 0.3s ease;
    }

    .social-icons a:hover {
      color: #0073e6; /* Hover color */
    }

    /* Footer Bottom */
    .footer-bottom {
      margin-top: 30px;
      font-size: 14px;
      color: #999;
    }

    /* Back to Top Button */
    #backToTopBtn {
      display: none;
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: #0073e6;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    #backToTopBtn:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      
      <!-- Left Side -->
      <div class="footer-left">
        <h3>Expense Tracker</h3>
        <p>Helping you manage your daily expenses smarter and easier.</p>

        <!-- Social Media Icons -->
        <div class="social-icons">
          <a href="https://facebook.com" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="https://twitter.com" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="https://linkedin.com" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          <a href="https://youtube.com" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
          <a href="https://pinterest.com" target="_blank" title="Pinterest"><i class="fab fa-pinterest"></i></a>
          <a href="https://wa.me/" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
      </div>

      <!-- Right Side -->
      <div class="footer-right">
        <ul class="footer-links">
          <li><a href="#top">Home</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="signup.html">Sign Up</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
      </div>

    </div>

    <!-- Bottom -->
    <div class="footer-bottom">
      <p>&copy; 2025 Expense Tracker | All rights reserved.</p>
    </div>

    <!-- Back to Top Button -->
    <button onclick="scrollToTop()" id="backToTopBtn" title="Go to top">
      <i class="fas fa-arrow-up"></i>
    </button>
  </footer>

  <!-- Back to Top Button Functionality -->
  <script>
    // Get the button
    let mybutton = document.getElementById("backToTopBtn");

    // When the user scrolls down 20px from the top of the document, show the button
    window.onscroll = function() {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        mybutton.style.display = "block";
      } else {
        mybutton.style.display = "none";
      }
    };

    // When the user clicks on the button, scroll to the top of the document
    function scrollToTop() {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }
  </script>
</body>
</html>
