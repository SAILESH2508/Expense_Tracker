<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <a href="#">Expense Tracker</a>
        </div>
        <div>
            <h1><marquee>WELCOME TO EXPENSE TRACKER</marquee></h1>
        </div>
        <ul class="nav-links">
            <li><a href="login.html">Dashboard</a></li>
            <li><a href="#" onclick="showSection('daily-expense')">Daily Expense</a></li>
            <li><a href="#" onclick="showSection('expense-history')">Expense History</a></li>
            <li><a href="login.html">Logout</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- Daily Expense Tracker -->
    <section id="daily-expense">
        <div class="container">
            <h1>Daily Expense Tracker</h1>

            <div class="budget-section">
                <label for="budget">Set Monthly Budget:</label>
                <input type="number" id="budget" placeholder="Enter your budget">
                <button onclick="setBudget()">Set Budget</button>
                <p id="budget-display">Budget: ₹0</p>
            </div>

            <div class="expense-form">
                <h2>Add Expense</h2>
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" placeholder="E.g., Groceries">
                <label for="expense-amount">Amount:</label>
                <input type="number" id="expense-amount" placeholder="E.g., 500">
                <label for="expense-category">Category:</label>
                <select id="expense-category">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Others">Others</option>
                </select>
                <button onclick="addExpense()">Add Expense</button>
            </div>
        </div>
    </section>

    <!-- Expense History -->
    <section id="expense-history" style="display: none;">
        <div class="container">
            <h1>Expense History</h1>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expense-list"></tbody>
            </table>
            <p><strong>Total Spent: ₹<span id="total-spent">0</span></strong></p>
            <p><strong>Remaining Budget: ₹<span id="remaining-budget">0</span></strong></p>
        </div>
    </section>

    <!-- Script Files -->
    <script src="script.js"></script>

    <!-- Section Toggler Script -->
    <script>
        function showSection(sectionId) {
            document.getElementById("daily-expense").style.display = (sectionId === "daily-expense") ? "block" : "none";
            document.getElementById("expense-history").style.display = (sectionId === "expense-history") ? "block" : "none";
        }
    </script>
   <div id="footer-placeholder"></div>

   <script>
     // Function to load the footer into the page
     function loadFooter() {
       fetch('footer.html')
         .then(response => response.text())
         .then(data => {
           document.getElementById('footer-placeholder').innerHTML = data;
         })
         .catch(error => console.error('Error loading the footer:', error));
     }
 
     // Call the loadFooter function on page load
     window.onload = loadFooter;
 
     // Back to top button functionality
     let mybutton = document.getElementById("backToTopBtn");
 
     window.onscroll = function() {
       if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
         mybutton.style.display = "block";
       } else {
         mybutton.style.display = "none";
       }
     };
 
     function scrollToTop() {
       document.body.scrollTop = 0;
       document.documentElement.scrollTop = 0;
     }
   </script>
</body>
</html>
